<html lang="zh-TW"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RJPQ 小工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--sur:#13131d;--sur2:#1c1c2e;--brd:#2a2a42;
  --teal:#00c9a7;--yellow:#ffd166;--red:#ef476f;
  --txt:#e8e8f0;--dim:#7a7a9a;--r:11px;--rs:7px;
  --orange:#ff8c42;--green:#3ddc84;--blue:#4fc3f7;--pink:#f06292;
}
body{background:var(--bg);color:var(--txt);font-family:'Inter','Microsoft JhengHei',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
/* ── Screens ── */
.scr{display:none;width:100%;justify-content:center}
.scr.on{display:flex}
/* ── Card ── */
.card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);
  padding:28px 24px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.55)}
.home-card{max-width:470px}
.room-card{max-width:530px}
/* ── Logo ── */
.logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.logo-icon{font-size:2.2rem}
.logo h1{font-size:1.4rem;font-weight:700;color:var(--teal)}
.logo .sub{font-size:.75rem;color:var(--dim);margin-top:2px}
/* ── Blocks ── */
.blk{margin-bottom:14px}
.lbl{display:block;font-size:.72rem;font-weight:600;color:var(--dim);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.irow{display:flex;gap:7px;flex-wrap:wrap}
/* ── Inputs ── */
input.f{flex:1;min-width:80px;background:var(--sur2);border:1px solid var(--brd);
  border-radius:var(--rs);color:var(--txt);font-size:.9rem;padding:8px 11px;outline:none;
  transition:border-color .2s;font-family:inherit}
input.f:focus{border-color:var(--teal)}
input.f::placeholder{color:var(--dim)}
/* ── Buttons ── */
.btn{border:none;border-radius:var(--rs);font-size:.88rem;font-weight:600;cursor:pointer;
  padding:8px 16px;transition:opacity .18s,transform .12s;white-space:nowrap;font-family:inherit}
.btn:hover{opacity:.85}.btn:active{transform:scale(.96)}
.btn-t{background:var(--teal);color:#000}
.btn-y{background:var(--yellow);color:#000}
.btn-g{background:transparent;border:1px solid var(--brd);border-radius:var(--rs);
  color:var(--dim);font-size:.8rem;cursor:pointer;padding:5px 11px;transition:border-color .2s,color .2s;font-family:inherit}
.btn-g:hover{border-color:var(--teal);color:var(--teal)}
.btn-i{background:var(--sur2);border:1px solid var(--brd);border-radius:var(--rs);
  color:var(--txt);font-size:.95rem;cursor:pointer;padding:5px 9px;
  transition:background .18s;line-height:1;font-family:inherit}
.btn-i:hover{background:var(--brd)}
.btn-i.danger:hover{background:#3a0018;border-color:var(--red);color:var(--red)}
/* ── Divider ── */
.div{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--dim);font-size:.75rem}
.div::before,.div::after{content:'';flex:1;border-top:1px solid var(--brd)}
/* ── Err ── */
.err{margin-top:5px;font-size:.78rem;color:var(--red);padding:5px 9px;
  background:rgba(239,71,111,.08);border-radius:var(--rs);border:1px solid rgba(239,71,111,.25)}
.h{display:none}
/* ── Footer ── */
.hfoot{margin-top:22px;display:flex;align-items:center;justify-content:space-between}
.fn{font-size:.7rem;color:var(--dim)}
/* ── Room topbar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.rinfo{display:flex;align-items:center;gap:7px;font-size:.83rem;flex-wrap:wrap}
.rlbl{color:var(--dim);font-size:.7rem;font-weight:600;text-transform:uppercase}
.rcval{color:var(--yellow);font-weight:700;font-size:.97rem;letter-spacing:.05em}
.rpval{color:var(--teal);font-weight:600;font-size:.88rem}
.racts{display:flex;align-items:center;gap:7px}
.pcount{font-size:.78rem;color:var(--dim);background:var(--sur2);
  border:1px solid var(--brd);border-radius:var(--rs);padding:3px 8px}
/* ── Color row ── */
.crow{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.cdots{display:flex;gap:9px}
.cdot{width:28px;height:28px;border-radius:50%;background:var(--c);
  border:3px solid transparent;cursor:pointer;
  transition:transform .15s,border-color .15s,opacity .15s;
  opacity:.4;position:relative}
.cdot:hover{transform:scale(1.1);opacity:.75}
.cdot.sel{border-color:#fff;opacity:1;transform:scale(1.15)}
.cdot.taken{opacity:.15;cursor:not-allowed}
.cdot.taken::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:rgba(255,255,255,.6);font-size:.7rem}
.chint{font-size:.76rem;color:var(--dim)}
/* ── Grid ── */
.gwrap{background:var(--sur2);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.ghdr{display:grid;grid-template-columns:38px repeat(4,1fr);background:#0f0f1a;padding:5px 9px;gap:3px}
.fnum,.dh{font-size:.68rem;color:var(--dim);font-weight:600;text-transform:uppercase;text-align:center}
.fnum{text-align:left}
.dg{display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:38px repeat(4,1fr);gap:3px;padding:4px 9px;
  border-top:1px solid var(--brd);align-items:center}
.frow:hover{background:rgba(255,255,255,.018)}
.fnc{font-size:.73rem;color:var(--dim);font-weight:600;text-align:center}
.dbtn{position:relative;height:33px;border-radius:var(--rs);
  border:1.5px solid var(--brd);background:var(--sur);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:3px;
  transition:border-color .15s,background .15s;overflow:hidden;user-select:none}
.dbtn:hover{border-color:var(--teal)}
.dbtn.mk{border-color:transparent}
.pip{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dbtn.wr::after{content:'✕';position:absolute;top:1px;right:3px;
  font-size:.58rem;color:var(--red);opacity:.8}
/* ── Legend ── */
.leg{font-size:.7rem;color:var(--dim);text-align:center;margin-bottom:4px}
/* ── Status bar ── */
.sbar{font-size:.75rem;color:var(--dim);background:var(--sur2);
  border:1px solid var(--brd);border-radius:var(--rs);padding:6px 10px;margin-bottom:12px;
  display:flex;align-items:center;gap:6px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}
.sdot.ok{background:var(--teal)}
.sdot.warn{background:var(--yellow)}
/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--sur2);border:1px solid var(--teal);color:var(--teal);
  border-radius:var(--rs);padding:9px 18px;font-size:.83rem;font-weight:600;
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ── Peer ID box ── */
.idbox{background:var(--sur2);border:1px solid var(--brd);border-radius:var(--rs);
  padding:9px 12px;font-size:.8rem;color:var(--yellow);font-family:monospace;
  word-break:break-all;margin-top:6px}
@media(max-width:460px){.card{padding:16px 12px}.topbar{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<!-- ═══ HOME ═══ -->
<div id="home-scr" class="scr on">
<div class="card home-card">
  <div class="logo">
    <span class="logo-icon">🗝️</span>
    <div>
      <h1>RJPQ 小工具</h1>
      <p class="sub">羅密歐與茱麗葉 組隊任務輔助</p>
    </div>
  </div>

  <!-- HOST -->
  <div class="blk">
    <label class="lbl">🏠 我是隊長（建立房間）</label>
    <div class="irow">
      <button class="btn btn-y" id="btn-host">建立房間</button>
    </div>
    <div id="host-info" class="idbox h"></div>
    <div id="host-err" class="err h"></div>
  </div>

  <div class="div"><span>或</span></div>

  <!-- JOIN -->
  <div class="blk">
    <label class="lbl">🤝 我是隊友（加入房間）</label>
    <div class="irow">
      <input class="f" id="join-id" placeholder="貼上隊長給的 ID" maxlength="80">
      <button class="btn btn-t" id="btn-join">加入</button>
    </div>
    <div id="join-err" class="err h"></div>
  </div>

  <div class="hfoot">
    <button class="btn-g" id="btn-lang">中文 ⇆ EN</button>
    <span class="fn">羅茱小工具 · 無需安裝</span>
  </div>
</div>
</div>

<!-- ═══ ROOM ═══ -->
<div id="room-scr" class="scr">
<div class="card room-card">

  <!-- Topbar -->
  <div class="topbar">
    <div class="rinfo">
      <span class="rlbl">ID</span>
      <span id="disp-id" class="rcval"></span>
      <button class="btn-i" id="btn-copy" title="複製連線資訊">⧉</button>
    </div>
    <div class="racts">
      <span id="pcount" class="pcount">👤 1</span>
      <button class="btn-i danger" id="btn-clear" title="清除所有標記">🧹</button>
      <button class="btn-i" id="btn-exit" title="離開">✕</button>
    </div>
  </div>

  <!-- Status -->
  <div class="sbar">
    <span class="sdot" id="conn-dot"></span>
    <span id="conn-txt">等待中…</span>
  </div>

  <!-- Color -->
  <div class="crow">
    <span class="lbl" id="clbl">選擇顏色：</span>
    <div class="cdots" id="cdots">
      <button class="cdot" data-color="orange" style="--c:var(--orange)" title="橘色"></button>
      <button class="cdot" data-color="green" style="--c:var(--green)" title="綠色"></button>
      <button class="cdot" data-color="blue" style="--c:var(--blue)" title="藍色"></button>
      <button class="cdot" data-color="pink" style="--c:var(--pink)" title="粉色"></button>
    </div>
    <span class="chint" id="chint">尚未選擇</span>
  </div>

  <!-- Grid -->
  <div class="gwrap">
    <div class="ghdr">
      <span class="fnum"></span>
      <span class="dh">門 1</span><span class="dh">門 2</span>
      <span class="dh">門 3</span><span class="dh">門 4</span>
    </div>
    <div class="dg" id="dgrid"></div>
  </div>

  <div class="leg">左鍵：標記通過（共享）｜右鍵：私人錯誤記錄</div>
</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════
   RJPQ Tool — PeerJS P2P version
   No server needed. Host creates a Peer, shares
   the Peer ID. Joiners connect directly to Host.
   Host broadcasts state to all connected peers.
   ═══════════════════════════════════════════════ */

const COLORS = ['orange','green','blue','pink'];
const CHX = {orange:'#ff8c42',green:'#3ddc84',blue:'#4fc3f7',pink:'#f06292'};
const CNAMES = {
  zh:{orange:'橘色',green:'綠色',blue:'藍色',pink:'粉色'},
  en:{orange:'Orange',green:'Green',blue:'Blue',pink:'Pink'}
};

let lang = 'zh';
let peer = null;
let isHost = false;
let myColor = null;
let hostConn = null;           // joiner → host connection
let peers = {};                // host: { peerId: DataConnection }
let playerColors = {};         // color → count (tracked by host, synced to joiners)

// Door state: [floor][door] = { colors:[], wrongMark:false }
let doors = mk10x4();
function mk10x4(){ return Array.from({length:10},()=>Array.from({length:4},()=>({colors:[],wrongMark:false}))) }

/* ── Toast ── */
function toast(msg,ms=2200){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>{ el.classList.remove('show') },ms);
}

/* ── Screen ── */
function showScr(name){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById(name+'-scr').classList.add('on');
}
function showErr(id,msg){ const e=document.getElementById(id); e.textContent=msg; e.classList.remove('h'); }
function hideEl(id){ document.getElementById(id).classList.add('h'); }
function showEl(id){ document.getElementById(id).classList.remove('h'); }

/* ── Status bar ── */
function setStatus(msg,state=''){
  document.getElementById('conn-txt').textContent=msg;
  const dot=document.getElementById('conn-dot');
  dot.className='sdot'+(state?' '+state:'');
}

/* ── Player count ── */
function updatePCount(){
  const n = isHost ? Object.keys(peers).length+1 : null;
  if(n!==null) document.getElementById('pcount').textContent='👤 '+n;
}

/* ═══ PeerJS init ═══ */
function initPeer(id=undefined){
  const opts = { debug: 0 };
  peer = id ? new Peer(id,opts) : new Peer(opts);

  peer.on('open', pid=>{
    if(isHost){
      document.getElementById('disp-id').textContent = pid;
      const info = 'RJPQ 小工具連線 ID：' + pid + '
請隊友打開工具，貼上此 ID 加入房間';
      document.getElementById('host-info').textContent = info;
      showEl('host-info');
      setStatus('等待隊友連線中…','warn');
      showScr('room');
      buildGrid();
      updatePCount();
    }
  });

  peer.on('connection', conn=>{ // host receives joiner
    setupConnection(conn, true);
  });

  peer.on('error', err=>{
    if(isHost) showErr('host-err','連線錯誤：'+err.message);
    else       showErr('join-err','連線錯誤：'+err.message);
    setStatus('連線錯誤','');
  });
}

/* ═══ Connection setup ═══ */
function setupConnection(conn, fromHost){
  conn.on('open',()=>{
    if(fromHost){
      // HOST side: new peer joined
      peers[conn.peer] = conn;
      setStatus('已連線 ' + Object.keys(peers).length + ' 位隊友','ok');
      updatePCount();
      // Send current state to new joiner
      conn.send({type:'init', doors: serializeDoors(), playerColors});
      // Notify others
      broadcast({type:'player_count', count:Object.keys(peers).length+1}, conn.peer);
    } else {
      // JOINER side: connected to host
      hostConn = conn;
      setStatus('已連線到隊長','ok');
    }
    toast(fromHost ? '🎉 隊友已加入！' : '✅ 成功連線！');
  });

  conn.on('data', msg=>handleMsg(msg, conn));

  conn.on('close',()=>{
    if(fromHost){
      delete peers[conn.peer];
      // Release color
      const lostColor = Object.keys(playerColors).find(c=>playerColors[c+'_pid']===conn.peer);
      if(lostColor){ delete playerColors[lostColor]; delete playerColors[lostColor+'_pid']; }
      broadcast({type:'player_colors', playerColors: cleanColors()});
      broadcast({type:'player_count', count:Object.keys(peers).length+1});
      updatePCount();
      setStatus('已連線 ' + Object.keys(peers).length + ' 位隊友','ok');
      toast('⚠ 一位隊友離線了');
    } else {
      setStatus('與隊長的連線中斷','');
      toast('⚠ 連線中斷');
    }
  });

  conn.on('error',err=>{
    setStatus('連線錯誤');
    console.error(err);
  });
}

function cleanColors(){
  const c={};
  for(const k of Object.keys(playerColors)){ if(!k.endsWith('_pid')) c[k]=playerColors[k]; }
  return c;
}

/* ═══ Message handler ═══ */
function handleMsg(msg, fromConn){
  const {type}=msg;

  /* ── JOINER receives from host ── */
  if(!isHost){
    if(type==='init'){
      doors = deserializeDoors(msg.doors);
      playerColors = msg.playerColors||{};
      renderAll(); updateColorDots();
    }
    if(type==='door_update'){
      doors[msg.f][msg.d].colors = msg.colors;
      renderDoor(msg.f,msg.d);
    }
    if(type==='cleared'){
      for(let f=0;f<10;f++) for(let d=0;d<4;d++) doors[f][d].colors=[];
      renderAll(); toast(lang==='zh'?'已清除所有標記':'All marks cleared');
    }
    if(type==='player_colors'){
      playerColors=msg.playerColors||{}; updateColorDots();
    }
    if(type==='player_count'){
      document.getElementById('pcount').textContent='👤 '+msg.count;
    }
    return;
  }

  /* ── HOST receives from joiner ── */
  if(type==='pick_color'){
    const {color, pid} = msg;
    // Release previous color held by this peer
    for(const c of COLORS){
      if(playerColors[c+'_pid']===pid){
        delete playerColors[c]; delete playerColors[c+'_pid'];
      }
    }
    if(!playerColors[color]){ // color available
      playerColors[color]=1;
      playerColors[color+'_pid']=pid;
    }
    const pub=cleanColors();
    broadcast({type:'player_colors',playerColors:pub});
    fromConn.send({type:'player_colors',playerColors:pub});
    return;
  }
  if(type==='toggle_door'){
    const {f,d,color} = msg;
    const cell=doors[f][d];
    const idx=cell.colors.indexOf(color);
    if(idx===-1) cell.colors.push(color); else cell.colors.splice(idx,1);
    renderDoor(f,d);
    broadcast({type:'door_update',f,d,colors:cell.colors});
    return;
  }
  if(type==='clear_all'){
    for(let f=0;f<10;f++) for(let d=0;d<4;d++) doors[f][d].colors=[];
    renderAll();
    broadcast({type:'cleared'});
    return;
  }
}

/* ═══ Broadcast (host→all joiners) ═══ */
function broadcast(msg, excludePid=null){
  for(const [pid,conn] of Object.entries(peers)){
    if(pid!==excludePid && conn.open) conn.send(msg);
  }
}

/* ═══ Send to host (joiner→host) ═══ */
function sendHost(msg){
  if(hostConn && hostConn.open) hostConn.send(msg);
}

/* ═══ Serialise doors ═══ */
function serializeDoors(){
  return doors.map(row=>row.map(c=>({colors:[...c.colors]})));
}
function deserializeDoors(raw){
  return raw.map(row=>row.map(c=>({colors:[...c.colors],wrongMark:false})));
}

/* ═══ Grid ═══ */
function buildGrid(){
  const g=document.getElementById('dgrid'); g.innerHTML='';
  for(let f=0;f<10;f++){
    const row=document.createElement('div'); row.className='frow';
    const lbl=document.createElement('span'); lbl.className='fnc'; lbl.textContent=f+1;
    row.appendChild(lbl);
    for(let d=0;d<4;d++){
      const btn=document.createElement('button'); btn.className='dbtn'; btn.id='d'+f+'_'+d;
      btn.addEventListener('click',()=>onLeft(f,d));
      btn.addEventListener('contextmenu',e=>{e.preventDefault();onRight(f,d)});
      row.appendChild(btn);
    }
    g.appendChild(row);
  }
}
function renderDoor(f,d,el){
  const btn=el||document.getElementById('d'+f+'_'+d); if(!btn) return;
  const {colors,wrongMark}=doors[f][d];
  btn.innerHTML='';
  if(colors.length){
    btn.classList.add('mk');
    btn.style.background=colors.length===1?CHX[colors[0]]+'33':
      'linear-gradient(135deg,'+colors.map(c=>CHX[c]+'55').join(',')+')'
    btn.style.borderColor=CHX[colors[0]];
    colors.forEach(c=>{const p=document.createElement('span');p.className='pip';p.style.background=CHX[c];btn.appendChild(p)});
  } else {
    btn.classList.remove('mk'); btn.style.background=''; btn.style.borderColor='';
  }
  wrongMark?btn.classList.add('wr'):btn.classList.remove('wr');
}
function renderAll(){for(let f=0;f<10;f++) for(let d=0;d<4;d++) renderDoor(f,d);}

/* ═══ Door clicks ═══ */
function onLeft(f,d){
  if(!myColor){ toast(lang==='zh'?'請先選擇顏色！':'Pick a color first!'); return; }
  if(isHost){
    const cell=doors[f][d];
    const idx=cell.colors.indexOf(myColor);
    if(idx===-1) cell.colors.push(myColor); else cell.colors.splice(idx,1);
    renderDoor(f,d);
    broadcast({type:'door_update',f,d,colors:cell.colors});
  } else {
    sendHost({type:'toggle_door',f,d,color:myColor});
  }
}
function onRight(f,d){
  doors[f][d].wrongMark=!doors[f][d].wrongMark; renderDoor(f,d);
}

/* ═══ Color picker ═══ */
function updateColorDots(){
  document.querySelectorAll('.cdot').forEach(dot=>{
    const c=dot.dataset.color; dot.classList.remove('sel','taken');
    if(c===myColor) dot.classList.add('sel');
    else if(cleanColors()[c]) dot.classList.add('taken');
  });
}
function pickColor(color){
  const pub=cleanColors();
  if(pub[color] && color!==myColor){ toast(lang==='zh'?'此顏色已被選走':'Color taken'); return; }
  myColor=color;
  if(isHost){
    // Remove old color
    for(const c of COLORS){ if(playerColors[c+'_pid']==='host'){ delete playerColors[c]; delete playerColors[c+'_pid']; } }
    playerColors[color]=1; playerColors[color+'_pid']='host';
    const pub2=cleanColors();
    broadcast({type:'player_colors',playerColors:pub2});
  } else {
    sendHost({type:'pick_color',color,pid:peer.id});
  }
  updateColorDots();
  document.getElementById('chint').textContent=(lang==='zh'?'已選：':'Selected: ')+CNAMES[lang][color];
}

/* ═══ Copy ═══ */
function copyInfo(){
  const id=document.getElementById('disp-id').textContent;
  const txt=isHost
    ?'RJPQ 連線 ID：'+id+'
小工具：請在加入房間貼上此 ID'
    :'RJPQ 連線 ID：'+id;
  navigator.clipboard.writeText(txt).then(()=>toast('✓ 已複製！')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=txt;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); toast('✓ 已複製！');
  });
}

/* ═══ Exit ═══ */
function doExit(){
  if(peer){ peer.destroy(); peer=null; }
  hostConn=null; peers={}; myColor=null; playerColors={};
  doors=mk10x4(); isHost=false;
  hideEl('host-info'); hideEl('host-err'); hideEl('join-err');
  document.getElementById('join-id').value='';
  document.getElementById('chint').textContent=lang==='zh'?'尚未選擇':'Not selected';
  showScr('home');
}

/* ═══ Clear all ═══ */
function doClear(){
  if(!confirm(lang==='zh'?'確定清除所有標記？':'Clear all marks?')) return;
  if(isHost){
    for(let f=0;f<10;f++) for(let d=0;d<4;d++) doors[f][d].colors=[];
    renderAll(); broadcast({type:'cleared'});
  } else {
    sendHost({type:'clear_all'});
  }
}

/* ═══ Lang ═══ */
const T={
  zh:{hhost:'🏠 我是隊長（建立房間）',host_btn:'建立房間',hjoin:'🤝 我是隊友（加入房間）',
      join_ph:'貼上隊長給的 ID',join_btn:'加入',clbl:'選擇顏色：',chint:'尚未選擇',
      dh:['門 1','門 2','門 3','門 4'],lang_btn:'中文 ⇆ EN'},
  en:{hhost:'🏠 Host (Create Room)',host_btn:'Create Room',hjoin:'🤝 Join Room',
      join_ph:'Paste Host\'s Peer ID',join_btn:'Join',clbl:'Pick color:',chint:'Not selected',
      dh:['Door 1','Door 2','Door 3','Door 4'],lang_btn:'EN ⇆ 中文'},
};
function applyLang(){
  const t=T[lang];
  document.querySelector('#home-scr .blk:nth-child(2) .lbl').textContent=t.hhost;
  document.getElementById('btn-host').textContent=t.host_btn;
  document.querySelector('#home-scr .blk:nth-child(4) .lbl').textContent=t.hjoin;
  document.getElementById('join-id').placeholder=t.join_ph;
  document.getElementById('btn-join').textContent=t.join_btn;
  document.getElementById('clbl').textContent=t.clbl;
  document.getElementById('chint').textContent=t.chint;
  document.querySelectorAll('.dh').forEach((el,i)=>{ if(t.dh[i]) el.textContent=t.dh[i]; });
  document.getElementById('btn-lang').textContent=t.lang_btn;
}

/* ═══ Bootstrap ═══ */
document.addEventListener('DOMContentLoaded',()=>{
  // Host
  document.getElementById('btn-host').addEventListener('click',()=>{
    hideEl('host-err'); isHost=true;
    setStatus('正在建立連線…','warn');
    showScr('room'); buildGrid(); updatePCount();
    setStatus('正在連接雲端 Peer 服務…','warn');
    initPeer();
  });

  // Join
  document.getElementById('btn-join').addEventListener('click',()=>{
    const hostId=document.getElementById('join-id').value.trim();
    if(!hostId){ showErr('join-err',lang==='zh'?'請貼上隊長的 ID':'Please enter host ID'); return; }
    hideEl('join-err'); isHost=false;
    initPeer();
    peer.on('open',()=>{
      document.getElementById('disp-id').textContent=hostId;
      const conn=peer.connect(hostId,{reliable:true});
      setupConnection(conn,false);
      setStatus('正在連線到隊長…','warn');
      showScr('room'); buildGrid(); updatePCount();
    });
  });
  document.getElementById('join-id').addEventListener('keydown',e=>{
    if(e.key==='Enter') document.getElementById('btn-join').click();
  });

  // Color dots
  document.querySelectorAll('.cdot').forEach(dot=>{
    dot.addEventListener('click',()=>pickColor(dot.dataset.color));
  });

  // Buttons
  document.getElementById('btn-copy').addEventListener('click',copyInfo);
  document.getElementById('btn-clear').addEventListener('click',doClear);
  document.getElementById('btn-exit').addEventListener('click',doExit);
  document.getElementById('btn-lang').addEventListener('click',()=>{
    lang=lang==='zh'?'en':'zh'; applyLang();
  });
});
</script>
</body></html>
